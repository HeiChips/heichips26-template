# LibreLane configuration file

DESIGN_NAME: heichips26_dna_sequencer
VERILOG_FILES: dir::../../rtl/*.sv
VERILOG_INCLUDE_DIRS:
  - dir::../../rtl/
CLOCK_PORT: clk
CLOCK_PERIOD: 7.6923076923 # 10ns = 100MHz, 7 = 143MHz

# Reduce wasted space
TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 6
RIGHT_MARGIN_MULT: 6

# Absolute die size
FP_SIZING: absolute

# Tiny DEF template
# DIE_AREA: [0, 0, 200, 200]
# FP_DEF_TEMPLATE: dir::heichips26_template_tiny.def

# Small DEF template
DIE_AREA: [0, 0, 500, 200]
FP_DEF_TEMPLATE: dir::heichips26_template_small.def

# Large DEF template
# DIE_AREA: [0, 0, 500, 415]
# FP_DEF_TEMPLATE: dir::heichips26_template_large.def

# Don't use power rings or TopMetal1 layer
PDN_MULTILAYER: false
RT_MAX_LAYER: Metal4
PDN_VERTICAL_LAYER: Metal4
PDN_HORIZONTAL_LAYER: Metal3

# Enable for better SystemVerilog support
USE_SLANG: true

# SYNTH_STRATEGY: 'AREA 2'
# PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
# GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05   #default
# PL_RESIZER_HOLD_MAX_BUFFER_PCT: 40